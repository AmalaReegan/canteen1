        function loadProducts(category) {
            const container = document.getElementById("productContainer");
            container.innerHTML = "";
            if (!products[category]) return;

            products[category].forEach(item => {
                cart[item.id] = cart[item.id] || 0;
                let product = document.createElement("div");
                product.className = "product";
                product.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <h5>${item.name}</h5>
                    <p>₹${item.price.toFixed(2)}</p>
                    <p>Added: <span id="count-${item.id}">${cart[item.id]}</span></p>
                    <button class="btn btn-secondary" onclick="updateCart('${item.id}', 1)">Add to Cart</button >
                    <button class="btn btn-success" onclick="updateCart('${item.id}', -1)">Remove</button>
                `;
                container.appendChild(product);
            });
        }

        function updateCart(productId, change) {
            if (!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if (cart[productId] < 0) cart[productId] = 0;
            document.getElementById(`count-${productId}`).innerText = cart[productId];
        }

        function viewCart() {
            const cartContainer = document.getElementById('cartContainer');
            const cartItemsContainer = document.getElementById('cartItems');
            const totalPriceElement = document.getElementById('totalPrice');

            cartContainer.style.display = 'block';
            cartItemsContainer.innerHTML = '';
            let total = 0;

            for (const productId in cart) {
                if (cart[productId] > 0) {
                    const product = Object.values(products).flat().find(p => p.id === productId);
                    if (!product) continue;

                    const subtotal = product.price * cart[productId];
                    total += subtotal;

                    cartItemsContainer.innerHTML += `
                        <div class="cart-item">
                            <span>${product.name}</span>
                            <span>Qty: ${cart[productId]}</span>
                            <span>₹${product.price}</span>
                            <span>Subtotal: ₹${subtotal}</span>
                        </div>
                    `;
                }
            }
            totalPriceElement.innerText = total;
        }

        function submitReview() {
            const name = document.getElementById("reviewerName").value;
            const text = document.getElementById("reviewText").value;
            if (name && text) {
                reviews.push({ name, text });
                displayReviews();
                document.getElementById("reviewerName").value = "";
                document.getElementById("reviewText").value = "";
            }
        }

        function displayReviews() {
            const reviewsList = document.getElementById("reviewsList");
            reviewsList.innerHTML = reviews.map(r => `<div class="review-item"><strong>${r.name}:</strong> ${r.text}</div>`).join("");
        }

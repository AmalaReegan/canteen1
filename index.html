<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALU CanteenEase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background-image: url('aluph.png');
            background-size: cover;
            background-position: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(232, 232, 232, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(0px); 
        }
        h1 {
            color: #4caf50;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }
        label {
            font-size: 16px;
            font-weight: bold;
        }
        input, button {
            font-size: 16px;
            padding: 10px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        p {
            align-self: center;
        }
        .toggle-link {
            color: #4caf50;
            cursor: pointer;
            font-weight: bold;
        }
        .gap-below {
            margin-bottom: 20px;
        }
        #homePage {
            display: none;
            text-align: center;
            padding: 30px;
        }
        #forgotPasswordForm {
            display: none;
            text-align: center;
        }
        #otpVerification {
            display: none;
            text-align: center;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const otpVerification = document.getElementById('otpVerification');
            const homePage = document.getElementById('homePage');
            const toggleToRegister = document.getElementById('toggleToRegister');
            const toggleToLogin = document.getElementById('toggleToLogin');
            const toggleToForgotPassword = document.getElementById('toggleToForgotPassword');
            const otpInput = document.getElementById('otpInput');
            const passwordResetForm = document.getElementById('passwordResetForm');

            toggleToRegister.addEventListener('click', function() {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            });

            toggleToLogin.addEventListener('click', function() {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            toggleToForgotPassword.addEventListener('click', function() {
                loginForm.style.display = 'none';
                forgotPasswordForm.style.display = 'block';
            });

            // Simulate sending OTP
            document.getElementById('forgotPasswordSubmit').addEventListener('click', function() {
                const mobileNumber = document.getElementById('mobileNumber').value;
                const studentName = document.getElementById('forgotStudentName').value;

                if (mobileNumber && studentName) {
                    // Generate a random OTP and simulate sending it
                    const otp = Math.floor(100000 + Math.random() * 900000); // 6 digit OTP
                    sessionStorage.setItem('otp', otp);
                    alert(`OTP Sent to ${mobileNumber}! OTP: ${otp}`);
                    forgotPasswordForm.style.display = 'none';
                    otpVerification.style.display = 'block';
                } else {
                    alert('Please fill in both fields!');
                }
            });

            // Verify OTP
            document.getElementById('verifyOTP').addEventListener('click', function() {
                const enteredOTP = otpInput.value;
                const storedOTP = sessionStorage.getItem('otp');

                if (enteredOTP === storedOTP) {
                    alert('OTP Verified! You can now reset your password.');
                    otpVerification.style.display = 'none';
                    passwordResetForm.style.display = 'block';
                } else {
                    alert('Invalid OTP!');
                }
            });

            // Reset password
            document.getElementById('resetPasswordSubmit').addEventListener('click', function() {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword && newPassword === confirmPassword) {
                    localStorage.setItem('password', newPassword);
                    alert('Password successfully reset!');
                    passwordResetForm.style.display = 'none';
                    loginForm.style.display = 'block';
                } else {
                    alert('Passwords do not match!');
                }
            });

            registerForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const studentName = document.getElementById('studentName').value;
                const regNumber = document.getElementById('regNumber').value;
                const dob = document.getElementById('dob').value;
                const password = document.getElementById('password').value;
                
                if (studentName && regNumber && dob && password) {
                    localStorage.setItem('studentName', studentName);
                    localStorage.setItem('regNumber', regNumber);
                    localStorage.setItem('dob', dob);
                    localStorage.setItem('password', password);
                    alert('Registration successful!');
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                } else {
                    alert('Please fill all fields');
                }
            });

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const regNumber = document.getElementById('loginRegNumber').value;
                const password = document.getElementById('loginPassword').value;
                
                const storedRegNumber = localStorage.getItem('regNumber');
                const storedPassword = localStorage.getItem('password');
                
                if (regNumber === storedRegNumber && password === storedPassword) {
                    alert('Login successful!');
                    loginForm.style.display = 'none';
                    window.location.href = "ecommerce.html";
                } else {
                    alert('Invalid Register Number or Password');
                }
            });
        });
    </script>
</head>
<body style="background-image: url(clgproimg1.jpeg);">
    <div class="container">
        <h1>ALU CanteenEase</h1>

        <div id="loginForm">
            <h2>Login</h2>
            <form>
                <label for="loginRegNumber">Register Number:</label>
                <input type="text" id="loginRegNumber" name="loginRegNumber" required>

                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required class="gap-below">

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <span id="toggleToRegister" class="toggle-link">Register here</span></p>
            <p>Forgot Password? <span id="toggleToForgotPassword" class="toggle-link">Click here</span></p>
        </div>

        <div id="registerForm" style="display: none;">
            <h2>Register</h2>
            <form>
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" name="studentName" required>

                <label for="regNumber">Register Number:</label>
                <input type="text" id="regNumber" name="regNumber" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label for="password">Create Password:</label>
                <input type="password" id="password" name="password" required class="gap-below">

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <span id="toggleToLogin" class="toggle-link">Login here</span></p>
        </div>

        <div id="forgotPasswordForm">
            <h2>Forgot Password</h2>
            <label for="forgotStudentName">Student Name:</label>
            <input type="text" id="forgotStudentName" required>

            <label for="mobileNumber">Mobile Number:</label>
            <input type="text" id="mobileNumber" required>

            <button type="button" id="forgotPasswordSubmit">Submit</button>
        </div>

        <div id="otpVerification">
            <h2>Enter OTP</h2>
            <input type="text" id="otpInput" required>
            <button type="button" id="verifyOTP">Verify OTP</button>
        </div>

        <div id="passwordResetForm" style="display: none;">
            <h2>Reset Password</h2>
            <label for="newPassword">New Password:</label>
            <input type="password" id="newPassword" required>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" required>

            <button type="button" id="resetPasswordSubmit">Reset Password</button>
        </div>
